<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ani's software engineering, machine learning, and data science portfolio.">
    <title>Ani — software, ML, and data</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <a class="skip-link" href="#sceneContent">Skip to content</a>
    <div id="blackOverlay" aria-label="Enter Ani's portfolio" role="button" tabindex="0">
        <span class="enter-mark" aria-hidden="true">↘</span>
        <span>click to explore</span>
    </div>
    <canvas id="fractalCanvas" aria-hidden="true"></canvas>
    <div class="texture" aria-hidden="true"></div>
    <header class="site-header">
        <a class="wordmark" href="#home" data-scene-link="home" aria-label="Ani, home">ani<span>.</span></a>
        <nav id="navBar" aria-label="Primary navigation"></nav>
        <p class="scene-count" aria-hidden="true"><span id="sceneNumber">01</span> / <span id="sceneTotal">03</span></p>
    </header>
    <main id="sceneContent" class="scene-content" tabindex="-1" aria-live="polite"></main>
    <footer class="site-footer">
        <p>scroll to explore</p>
        <div class="progress-track" aria-hidden="true"><span id="sceneProgress"></span></div>
        <p id="cameraReadout" class="camera-readout"></p>
    </footer>
    <aside id="authorPanel" class="author-panel" aria-label="Author tools" hidden>
        <div><strong>Author mode</strong><kbd>D</kbd></div>
        <pre id="authorCoordinates"></pre>
        <button id="copyPositionBtn" type="button">Copy scene JSON</button>
    </aside>
    <div id="authorCrosshair" class="author-crosshair" hidden aria-hidden="true"></div>
    <noscript>This portfolio uses JavaScript to render and navigate an interactive fractal.</noscript>
    <script src="scene-data.js"></script>
    <script src="script.js"></script>
    <script src="site-controller.js"></script>
</body>
</html>
